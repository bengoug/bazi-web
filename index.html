<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaZi Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-container">
    <header>
        <h1>BaZi Manager</h1>
        <p class="subtitle">Upload, extraction et stockage de chartes BaZi, Zhi Run et QMDJ</p>
    </header>

    <!-- Config Toggle -->
    <div class="config-toggle" id="configToggle">
        <span>&#9881;</span> Configuration GitHub <span id="configArrow">&#9660;</span>
    </div>
    <div class="config-panel" id="configPanel">
        <div class="card">
            <div class="form-row">
                <div class="form-group">
                    <label>GitHub Personal Access Token</label>
                    <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx">
                </div>
                <div class="form-group">
                    <label>Repo (owner/name)</label>
                    <input type="text" id="githubRepo" placeholder="username/bazi-manager">
                </div>
            </div>
            <button class="btn btn-secondary btn-sm" id="saveConfigBtn">Sauvegarder la config</button>
            <div class="status" id="configStatus"></div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="upload">Upload + Extraction</button>
        <button class="tab-btn" data-tab="files">Fichiers stockes</button>
    </div>

    <!-- Tab: Upload + Extraction -->
    <div class="tab-content active" id="tab-upload">
        <div class="card">
            <h2>Importer un fichier</h2>

            <div class="form-row">
                <div class="form-group">
                    <label>Personne</label>
                    <div class="form-group-inline">
                        <select id="personSelect">
                            <option value="">-- Choisir --</option>
                        </select>
                        <button class="btn btn-secondary btn-sm" id="addPersonBtn" title="Ajouter une personne">+</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Type de fichier</label>
                    <select id="fileType">
                        <option value="bazi">&#127983; BaZi</option>
                        <option value="zhirun">&#129517; Zhi Run</option>
                        <option value="qmdj">&#128197; QMDJ du Jour</option>
                    </select>
                </div>
            </div>

            <!-- Drop Zone -->
            <div class="drop-zone" id="dropZone">
                <div class="drop-icon">&#128194;</div>
                <div class="drop-text">
                    Glissez votre fichier HTML ici ou <strong>cliquez pour choisir</strong>
                </div>
                <div class="file-name" id="fileName" style="display:none"></div>
                <input type="file" id="fileInput" accept=".html,.htm" style="display:none">
            </div>

            <!-- Action Buttons -->
            <div class="btn-group">
                <button class="btn btn-primary" id="extractBtn" disabled>Extraire</button>
                <button class="btn btn-secondary" id="downloadBtn" disabled>Telecharger l'extraction</button>
                <button class="btn btn-secondary" id="storeBtn" disabled>Stocker sur GitHub</button>
            </div>

            <div class="status" id="actionStatus"></div>
        </div>

        <!-- Preview -->
        <div class="preview-area" id="previewArea">
            <div class="card">
                <h2>Apercu de l'extraction</h2>
                <iframe class="preview-frame" id="previewFrame" sandbox="allow-same-origin"></iframe>
            </div>
        </div>
    </div>

    <!-- Tab: Files -->
    <div class="tab-content" id="tab-files">
        <div class="card">
            <h2>Fichiers stockes sur GitHub</h2>
            <button class="btn btn-secondary btn-sm" id="refreshFilesBtn">Rafraichir</button>
            <div class="status" id="filesStatus"></div>
            <div id="filesList" style="margin-top:16px">
                <div class="empty-state">
                    <div class="empty-icon">&#128193;</div>
                    <p>Configurez votre token GitHub et cliquez sur Rafraichir</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/parser-bazi.js"></script>
<script src="js/parser-zhirun.js"></script>
<script src="js/formatter.js"></script>
<script src="js/app.js"></script>
</body>
</html>
